name: Validate Claude Code adapter

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python scripts/check_claude_code_adapter.py
      - run: python scripts/check_protocol_fixtures.py
